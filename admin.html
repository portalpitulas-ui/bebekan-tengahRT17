<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Bebekan Tengah</title>
<style>
:root{--g:#087443;--d:#064d31;--l:#eef9f1;--r:#c43d3d;--m:#65766e}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17352a}button,input,textarea{font:inherit}button{cursor:pointer}.top{background:var(--d);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 61px)}aside{background:#fff;border-right:1px solid #dde7e0;padding:15px}.nav{display:block;width:100%;padding:11px;border:0;background:#fff;text-align:left;border-radius:9px;margin:4px 0}.nav.active,.nav:hover{background:var(--l);color:var(--g);font-weight:700}.main{padding:22px;max-width:1100px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:15px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:12px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,textarea{width:100%;padding:10px;border:1px solid #d5e0da;border-radius:8px}textarea{min-height:100px}.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 15px;font-weight:700}.btn.gray{background:#e9f1ec;color:var(--g)}.btn.red{background:#fff0f0;color:var(--r)}.item{border:1px solid #e0e8e3;border-radius:11px;padding:13px;margin:9px 0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#064d31,#0b8a50)}.loginbox{background:#fff;padding:30px;border-radius:18px;width:min(420px,90%)}.muted{color:var(--m);font-size:13px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat div{background:var(--l);padding:15px;border-radius:10px}.stat b{display:block;font-size:25px;color:var(--g)}@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{display:flex;overflow:auto}.nav{min-width:max-content}.grid,.stat{grid-template-columns:1fr}.main{padding:12px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>🔐 Admin Kampung</h1><p class="muted">Bebekan Tengah RT 17 / RW 05</p><div class="field"><label>Email Admin</label><input id="email" type="email" placeholder="admin@email.com"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn" onclick="login()">Masuk</button><p id="loginMsg"></p></div></div>
<div id="app" class="hidden"><header class="top"><b>🌿 Admin Bebekan Tengah</b><button class="btn gray" onclick="logout()">Keluar</button></header><div class="wrap"><aside>
<button class="nav active" onclick="tab('dash',this)">📊 Dashboard</button><button class="nav" onclick="tab('general',this)">🏠 Beranda</button><button class="nav" onclick="tab('profile',this)">🏘️ Profil</button><button class="nav" onclick="tab('staff',this)">👥 Pengurus</button><button class="nav" onclick="tab('news',this)">📢 Informasi</button><button class="nav" onclick="tab('events',this)">📅 Kegiatan</button><button class="nav" onclick="tab('gallery',this)">📸 Galeri</button><button class="nav" onclick="tab('contact',this)">📞 Kontak</button>
</aside><main class="main">
<section id="dash" class="tab"><div class="panel"><h2>Dashboard</h2><p id="who"></p><div class="stat"><div><b id="si">0</b>Informasi</div><div><b id="se">0</b>Kegiatan</div><div><b id="sg">0</b>Foto</div></div></div></section>
<section id="general" class="tab hidden"><div class="panel"><h2>Beranda</h2><div class="grid"><div class="field"><label>Judul</label><input id="gt"></div><div class="field"><label>RT / RW</label><input id="gs"></div><div class="field"><label>Slogan</label><input id="gsl"></div><div class="field"><label>URL Foto Banner</label><input id="gi"></div></div><div class="field"><label>Sambutan</label><textarea id="gw"></textarea></div><button class="btn" onclick="saveGeneral()">Simpan</button></div></section>
<section id="profile" class="tab hidden"><div class="panel"><h2>Profil</h2><div class="grid"><div class="field"><label>Kelurahan</label><input id="kel"></div><div class="field"><label>Kecamatan</label><input id="kec"></div><div class="field"><label>Kota/Kabupaten</label><input id="kota"></div><div class="field"><label>Provinsi</label><input id="prov"></div></div><div class="field"><label>Profil</label><textarea id="p"></textarea></div><div class="field"><label>Sejarah</label><textarea id="h"></textarea></div><button class="btn" onclick="saveProfile()">Simpan</button></div></section>
<section id="staff" class="tab hidden"><div class="panel"><h2>Pengurus</h2><div id="staffList"></div><button class="btn" onclick="addStaff()">+ Tambah</button></div></section>
<section id="news" class="tab hidden"><div class="panel"><h2>Informasi</h2><div id="newsList"></div><button class="btn" onclick="addNews()">+ Tambah</button></div></section>
<section id="events" class="tab hidden"><div class="panel"><h2>Kegiatan</h2><div id="eventList"></div><button class="btn" onclick="addEvent()">+ Tambah</button></div></section>
<section id="gallery" class="tab hidden"><div class="panel"><h2>Galeri</h2><p class="muted">Masukkan URL foto publik. Bisa memakai URL gambar dari hosting/cloud.</p><div id="galleryList"></div><button class="btn" onclick="addGallery()">+ Tambah</button></div></section>
<section id="contact" class="tab hidden"><div class="panel"><h2>Kontak</h2><div class="grid"><div class="field"><label>Ketua RT</label><input id="cn"></div><div class="field"><label>WhatsApp</label><input id="cw"></div><div class="field"><label>Email</label><input id="ce"></div><div class="field"><label>Alamat</label><input id="ca"></div><div class="field"><label>Google Maps URL</label><input id="cm"></div></div><button class="btn" onclick="saveContact()">Simpan</button></div></section>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUPABASE_URL =
  "https://ecufesvndczpxtjjkznf.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_gZHRu-Mptte4AeOXBYQ_dQ_qinsK7Z2";
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
function tab(id,el){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el?.classList.add('active')}
async function login(){loginMsg.textContent='Memeriksa...';const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginMsg.textContent=error.message;return}await init()}
async function logout(){await sb.auth.signOut();location.reload()}
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:a}=await sb.from('admins').select('*').eq('user_id',user.id).maybeSingle();if(!a){await sb.auth.signOut();loginMsg.textContent='Akun login bukan admin.';return}login.classList.add('hidden');app.classList.remove('hidden');who.textContent='Login sebagai '+a.email;loadAll()}
async function loadAll(){const [s,st,n,e,g,c]=await Promise.all([sb.from('site_content').select('*').eq('id',1).single(),sb.from('staff').select('*').order('sort_order'),sb.from('announcements').select('*').order('date',{ascending:false}),sb.from('events').select('*').order('date'),sb.from('gallery').select('*').order('created_at',{ascending:false}),sb.from('contact').select('*').eq('id',1).single()]);const x=s.data;if(x){gt.value=x.hero_title;gs.value=x.hero_sub;gsl.value=x.slogan;gw.value=x.welcome;gi.value=x.hero_image;kel.value=x.kelurahan;kec.value=x.kecamatan;kota.value=x.kota;prov.value=x.provinsi;p.value=x.profile;h.value=x.history}const staff=st.data||[],news=n.data||[],events=e.data||[],gallery=g.data||[],contact=c.data;si.textContent=news.length;se.textContent=events.length;sg.textContent=gallery.length;
staffList.innerHTML=staff.map((x,i)=>`<div class=item><div class=grid><div class=field><label>Jabatan</label><input id="sr${i}" value="${esc(x.role)}"></div><div class=field><label>Nama</label><input id="sn${i}" value="${esc(x.name)}"></div></div><button class=btn onclick="updateStaff('${x.id}',${i})">Simpan</button> <button class="btn red" onclick="del('staff','${x.id}')">Hapus</button></div>`).join('');
newsList.innerHTML=news.map((x,i)=>`<div class=item><div class=grid><div class=field><label>Judul</label><input id="nt${i}" value="${esc(x.title)}"></div><div class=field><label>Tanggal</label><input id="nd${i}" type=date value="${esc(x.date)}"></div></div><div class=field><label>Isi</label><textarea id="nb${i}">${esc(x.body)}</textarea></div><button class=btn onclick="updateNews('${x.id}',${i})">Simpan</button> <button class="btn red" onclick="del('announcements','${x.id}')">Hapus</button></div>`).join('');
eventList.innerHTML=events.map((x,i)=>`<div class=item><div class=grid><div class=field><label>Nama</label><input id="et${i}" value="${esc(x.title)}"></div><div class=field><label>Tanggal</label><input id="ed${i}" type=date value="${esc(x.date)}"></div><div class=field><label>Jam</label><input id="etime${i}" value="${esc(x.time)}"></div><div class=field><label>Lokasi</label><input id="ep${i}" value="${esc(x.place)}"></div></div><div class=field><label>Keterangan</label><textarea id="eb${i}">${esc(x.body)}</textarea></div><button class=btn onclick="updateEvent('${x.id}',${i})">Simpan</button> <button class="btn red" onclick="del('events','${x.id}')">Hapus</button></div>`).join('');
galleryList.innerHTML=gallery.map((x,i)=>`<div class=item><div class=field><label>Judul</label><input id="gtl${i}" value="${esc(x.title)}"></div><div class=field><label>URL Foto</label><input id="gu${i}" value="${esc(x.image_url)}"></div><button class=btn onclick="updateGallery('${x.id}',${i})">Simpan</button> <button class="btn red" onclick="del('gallery','${x.id}')">Hapus</button></div>`).join('');
if(contact.data){cn.value=contact.data.leader_name;cw.value=contact.data.whatsapp;ce.value=contact.data.email;ca.value=contact.data.address;cm.value=contact.data.maps_url}}
async function ok(promise){const {error}=await promise;if(error)alert(error.message);else{alert('Tersimpan');loadAll()}}
async function saveGeneral(){await ok(sb.from('site_content').update({hero_title:gt.value,hero_sub:gs.value,slogan:gsl.value,welcome:gw.value,hero_image:gi.value}).eq('id',1))}
async function saveProfile(){await ok(sb.from('site_content').update({kelurahan:kel.value,kecamatan:kec.value,kota:kota.value,provinsi:prov.value,profile:p.value,history:h.value}).eq('id',1))}
async function saveContact(){await ok(sb.from('contact').update({leader_name:cn.value,whatsapp:cw.value,email:ce.value,address:ca.value,maps_url:cm.value}).eq('id',1))}
async function addStaff(){await ok(sb.from('staff').insert({role:'Jabatan Baru',name:'[NAMA]'}))}
async function updateStaff(id,i){await ok(sb.from('staff').update({role:document.getElementById('sr'+i).value,name:document.getElementById('sn'+i).value}).eq('id',id))}
async function addNews(){await ok(sb.from('announcements').insert({title:'Pengumuman Baru',body:'[ISI PENGUMUMAN]',date:new Date().toISOString().slice(0,10)}))}
async function updateNews(id,i){await ok(sb.from('announcements').update({title:nt[i].value,body:nb[i].value,date:nd[i].value}).eq('id',id))}
async function addEvent(){await ok(sb.from('events').insert({title:'Kegiatan Baru',date:new Date().toISOString().slice(0,10),time:'[JAM]',place:'[LOKASI]',body:'[KETERANGAN]'}))}
async function updateEvent(id,i){await ok(sb.from('events').update({title:et[i].value,date:ed[i].value,time:etime[i].value,place:ep[i].value,body:eb[i].value}).eq('id',id))}
async function addGallery(){await ok(sb.from('gallery').insert({title:'Foto Baru',image_url:'https://'}))}
async function updateGallery(id,i){await ok(sb.from('gallery').update({title:gtl[i].value,image_url:gu[i].value}).eq('id',id))}
async function del(table,id){if(confirm('Hapus data ini?'))await ok(sb.from(table).delete().eq('id',id))}
sb.auth.getSession().then(({data})=>{if(data.session)init()})
</script></body></html>
