<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kampung Bebekan Tengah - RT 17 / RW 05</title>

<style>
:root{
  --green:#16834a;
  --green-dark:#0d6337;
  --green-soft:#eaf7ef;
  --mint:#f5fbf7;
  --text:#183027;
  --muted:#64746c;
  --white:#fff;
  --border:#dce9e1;
  --shadow:0 10px 30px rgba(20,70,45,.08);
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--mint);
  color:var(--text);
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-weight:800;
  color:var(--green);
  font-size:18px;
}

.logo span{
  display:block;
  color:var(--text);
  font-size:12px;
  font-weight:600;
}

nav{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

nav a{
  font-size:14px;
  font-weight:600;
}

nav a:hover{
  color:var(--green);
}

.c{
  max-width:1150px;
  margin:auto;
  padding:25px 20px;
}

.hero{
  min-height:430px;
  border-radius:24px;
  overflow:hidden;
  display:flex;
  align-items:center;
  padding:50px;
  background-size:cover;
  background-position:center;
  position:relative;
  margin-bottom:30px;
  background-color:#16834a;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(0,0,0,.72),
    rgba(0,0,0,.38),
    rgba(0,0,0,.08)
  );
}

.hero-content{
  position:relative;
  color:#fff;
  max-width:700px;
}

.hero h1{
  font-size:48px;
  line-height:1.1;
  margin-bottom:15px;
}

.hero p{
  font-size:18px;
  margin-bottom:20px;
}

.badge{
  display:inline-block;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.3);
  padding:8px 14px;
  border-radius:50px;
  margin-bottom:15px;
  font-size:14px;
}

.btn{
  display:inline-block;
  background:var(--green);
  color:#fff;
  padding:11px 18px;
  border-radius:10px;
  font-weight:700;
}

.btn:hover{
  background:var(--green-dark);
}

section{
  margin-bottom:35px;
}

.section-title{
  margin-bottom:18px;
}

.section-title h2{
  font-size:28px;
}

.section-title p{
  color:var(--muted);
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.card h3{
  margin-bottom:8px;
}

.muted{
  color:var(--muted);
}

.info-list{
  display:grid;
  gap:12px;
}

.info-item{
  padding:15px;
  background:var(--green-soft);
  border-radius:12px;
}

.staff{
  text-align:center;
}

.staff img{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:12px;
  border:4px solid var(--green-soft);
}

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.gallery-item{
  overflow:hidden;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--border);
}

.gallery-item img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block;
}

.gallery-item div{
  padding:10px;
  font-weight:700;
}

.event-date{
  display:inline-block;
  background:var(--green-soft);
  color:var(--green-dark);
  padding:5px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
  background:#fff;
  border:1px dashed var(--border);
  border-radius:15px;
}

.loading{
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
}

footer{
  background:var(--green-dark);
  color:#fff;
  margin-top:50px;
}

.footer-inner{
  max-width:1150px;
  margin:auto;
  padding:35px 20px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:30px;
}

footer h3{
  margin-bottom:10px;
}

footer p{
  opacity:.9;
  font-size:14px;
}

@media(max-width:850px){

  .grid,
  .grid-2{
    grid-template-columns:1fr 1fr;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .footer-inner{
    grid-template-columns:1fr 1fr;
  }

  .hero h1{
    font-size:38px;
  }
}

@media(max-width:600px){

  .nav{
    align-items:flex-start;
    flex-direction:column;
  }

  nav{
    gap:10px;
  }

  .c{
    padding:15px;
  }

  .hero{
    padding:30px 25px;
    min-height:390px;
  }

  .hero h1{
    font-size:32px;
  }

  .hero p{
    font-size:16px;
  }

  .grid,
  .grid-2,
  .gallery,
  .footer-inner{
    grid-template-columns:1fr;
  }

  .gallery-item img{
    height:220px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      KAMPUNG BEBEKAN TENGAH
      <span>RT 17 / RW 05</span>
    </div>

    <nav>
      <a href="#beranda">Beranda</a>
      <a href="#profil">Profil</a>
      <a href="#pengurus">Pengurus</a>
      <a href="#informasi">Informasi</a>
      <a href="#agenda">Agenda</a>
      <a href="#galeri">Galeri</a>
      <a href="#lingkungan">Lingkungan</a>
      <a href="#kontak">Kontak</a>
    </nav>

  </div>
</header>

<main id="app">

  <div class="loading">
    Memuat data Kampung Bebekan Tengah...
  </div>

</main>

<footer>

  <div class="footer-inner">

    <div>
      <h3>Kampung Bebekan Tengah</h3>
      <p>RT 17 / RW 05</p>
      <p>Guyub • Rukun • Bersih • Aman • Nyaman</p>
    </div>

    <div>
      <h3>Menu</h3>
      <p><a href="#profil">Profil Kampung</a></p>
      <p><a href="#informasi">Informasi</a></p>
      <p><a href="#agenda">Agenda</a></p>
      <p><a href="#galeri">Galeri</a></p>
    </div>

    <div>
      <h3>Kontak</h3>
      <div id="footerContact">
        <p>Memuat...</p>
      </div>
    </div>

  </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
"https://ecufesvndczpxtjjkznf.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_gZHRu-Mptte4AeOXBYQ_dQ_qinsK7Z2";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =====================================================
   HELPER
   ===================================================== */

function esc(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatDate(date){

  if(!date){
    return "";
  }

  try{

    return new Date(date).toLocaleDateString(
      "id-ID",
      {
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );

  }catch(e){

    return date;

  }
}


/* =====================================================
   LOAD DATA SUPABASE
   ===================================================== */

async function loadWebsite(){

  try{

    const [

      siteResult,
      staffResult,
      announcementResult,
      eventResult,
      galleryResult,
      contactResult

    ] = await Promise.all([

      sb
        .from("site_content")
        .select("*")
        .eq("id",1)
        .single(),

      sb
        .from("staff")
        .select("*")
        .order("sort_order"),

      sb
        .from("announcements")
        .select("*")
        .order("date",{ascending:false}),

      sb
        .from("events")
        .select("*")
        .order("date"),

      sb
        .from("gallery")
        .select("*")
        .order("created_at",{ascending:false}),

      sb
        .from("contact")
        .select("*")
        .eq("id",1)
        .single()

    ]);


    /* CEK ERROR */

    const results = [

      siteResult,
      staffResult,
      announcementResult,
      eventResult,
      galleryResult,
      contactResult

    ];

    for(const result of results){

      if(result.error){

        throw result.error;

      }

    }


    const s  = siteResult.data;
    const st = staffResult.data || [];
    const an = announcementResult.data || [];
    const ev = eventResult.data || [];
    const ga = galleryResult.data || [];
    const co = contactResult.data;


    /* =================================================
       DATA UTAMA
       ================================================= */

    const heroTitle =
      s?.hero_title ||
      "KAMPUNG BEBEKAN TENGAH";

    const heroSub =
      s?.hero_sub ||
      "RT 17 / RW 05";

    const slogan =
      s?.slogan ||
      "Guyub • Rukun • Bersih • Aman • Nyaman";

    const welcome =
      s?.welcome ||
      "Selamat datang di website resmi Kampung Bebekan Tengah.";


    let heroStyle = "";

    if(s?.hero_image){

      heroStyle =
        `background-image:url('${esc(s.hero_image)}');`;

    }


    /* =================================================
       PROFIL
       ================================================= */

    const profile =
      s?.profile ||
      "Informasi profil Kampung Bebekan Tengah belum tersedia.";

    const history =
      s?.history ||
      "Informasi sejarah kampung belum tersedia.";


    /* =================================================
       PENGURUS
       ================================================= */

    let staffHTML = "";

    if(st.length === 0){

      staffHTML = `
        <div class="empty">
          Data pengurus belum tersedia.
        </div>
      `;

    }else{

      staffHTML = st.map(person => `

        <div class="card staff">

          ${
            person.photo_url

            ?

            `<img
              src="${esc(person.photo_url)}"
              alt="${esc(person.name)}"
            >`

            :

            `<div style="
              width:110px;
              height:110px;
              margin:0 auto 12px;
              border-radius:50%;
              background:var(--green-soft);
              display:flex;
              align-items:center;
              justify-content:center;
              color:var(--green);
              font-weight:bold;
            ">
              RT
            </div>`
          }

          <h3>
            ${esc(person.name)}
          </h3>

          <p class="muted">
            ${esc(person.role)}
          </p>

        </div>

      `).join("");

    }


    /* =================================================
       INFORMASI
       ================================================= */

    let announcementHTML = "";

    if(an.length === 0){

      announcementHTML = `
        <div class="empty">
          Belum ada informasi warga.
        </div>
      `;

    }else{

      announcementHTML = an.map(item => `

        <div class="card">

          <span class="event-date">
            ${formatDate(item.date)}
          </span>

          <h3>
            ${esc(item.title)}
          </h3>

          <p class="muted">
            ${esc(item.body)}
          </p>

        </div>

      `).join("");

    }


    /* =================================================
       AGENDA
       ================================================= */

    let eventHTML = "";

    if(ev.length === 0){

      eventHTML = `
        <div class="empty">
          Belum ada agenda kegiatan.
        </div>
      `;

    }else{

      eventHTML = ev.map(item => `

        <div class="card">

          <span class="event-date">
            ${formatDate(item.date)}
          </span>

          <h3>
            ${esc(item.title)}
          </h3>

          ${
            item.time
            ?
            `<p>
              <b>Waktu:</b> ${esc(item.time)}
            </p>`
            :
            ""
          }

          ${
            item.place
            ?
            `<p>
              <b>Tempat:</b> ${esc(item.place)}
            </p>`
            :
            ""
          }

          ${
            item.body
            ?
            `<p class="muted">
              ${esc(item.body)}
            </p>`
            :
            ""
          }

        </div>

      `).join("");

    }


    /* =================================================
       GALERI
       ================================================= */

    let galleryHTML = "";

    if(ga.length === 0){

      galleryHTML = `
        <div class="empty">
          Belum ada foto kegiatan.
        </div>
      `;

    }else{

      galleryHTML = ga.map(item => `

        <div class="gallery-item">

          ${
            item.image_url

            ?

            `<img
              src="${esc(item.image_url)}"
              alt="${esc(item.title)}"
              loading="lazy"
            >`

            :

            ""
          }

          <div>
            ${esc(item.title)}
          </div>

        </div>

      `).join("");

    }


    /* =================================================
       KONTAK
       ================================================= */

    let contactHTML = "";

    if(co){

      contactHTML = `

        ${
          co.leader_name

          ?

          `<div class="info-item">
            <b>Ketua RT</b><br>
            ${esc(co.leader_name)}
          </div>`

          :

          ""
        }

        ${
          co.whatsapp

          ?

          `<div class="info-item">
            <b>WhatsApp</b><br>

            <a
              href="https://wa.me/${String(co.whatsapp).replace(/\D/g,"")}"
              target="_blank"
              rel="noopener"
            >
              ${esc(co.whatsapp)}
            </a>

          </div>`

          :

          ""
        }

        ${
          co.email

          ?

          `<div class="info-item">
            <b>Email</b><br>
            ${esc(co.email)}
          </div>`

          :

          ""
        }

        ${
          co.address

          ?

          `<div class="info-item">
            <b>Alamat</b><br>
            ${esc(co.address)}
          </div>`

          :

          ""
        }

        ${
          co.maps_url

          ?

          `<div style="margin-top:15px">

            <a
              class="btn"
              href="${esc(co.maps_url)}"
              target="_blank"
              rel="noopener"
            >
              📍 Lihat Lokasi
            </a>

          </div>`

          :

          ""
        }

      `;

    }else{

      contactHTML = `
        <div class="empty">
          Data kontak belum tersedia.
        </div>
      `;

    }


    /* =================================================
       TAMPILKAN WEBSITE
       ================================================= */

    document.getElementById("app").innerHTML = `

      <div class="c">


        <!-- BERANDA -->

        <section id="beranda">

          <div
            class="hero"
            style="${heroStyle}"
          >

            <div class="hero-content">

              <span class="badge">
                ${esc(heroSub)}
              </span>

              <h1>
                ${esc(heroTitle)}
              </h1>

              <p>
                ${esc(slogan)}
              </p>

              <a
                href="#profil"
                class="btn"
              >
                Kenali Kampung Kami
              </a>

            </div>

          </div>

        </section>


        <!-- SAMBUTAN -->

        <section>

          <div class="card">

            <div class="section-title">

              <h2>
                Selamat Datang
              </h2>

            </div>

            <p>
              ${esc(welcome)}
            </p>

          </div>

        </section>


        <!-- PROFIL -->

        <section id="profil">

          <div class="section-title">

            <h2>
              Profil Kampung
            </h2>

            <p>
              Mengenal lebih dekat Kampung Bebekan Tengah.
            </p>

          </div>

          <div class="grid-2">

            <div class="card">

              <h3>
                Tentang Kampung
              </h3>

              <p class="muted">
                ${esc(profile)}
              </p>

            </div>

            <div class="card">

              <h3>
                Sejarah
              </h3>

              <p class="muted">
                ${esc(history)}
              </p>

            </div>

          </div>

        </section>


        <!-- PENGURUS -->

        <section id="pengurus">

          <div class="section-title">

            <h2>
              Struktur Kepengurusan RT
            </h2>

            <p>
              Pengurus Kampung Bebekan Tengah RT 17 / RW 05.
            </p>

          </div>

          <div class="grid">

            ${staffHTML}

          </div>

        </section>


        <!-- INFORMASI -->

        <section id="informasi">

          <div class="section-title">

            <h2>
              Informasi Warga
            </h2>

            <p>
              Informasi terbaru untuk warga.
            </p>

          </div>

          <div class="grid">

            ${announcementHTML}

          </div>

        </section>


        <!-- AGENDA -->

        <section id="agenda">

          <div class="section-title">

            <h2>
              Kegiatan & Agenda
            </h2>

            <p>
              Jadwal kegiatan Kampung Bebekan Tengah.
            </p>

          </div>

          <div class="grid">

            ${eventHTML}

          </div>

        </section>


        <!-- GALERI -->

        <section id="galeri">

          <div class="section-title">

            <h2>
              Galeri Kampung
            </h2>

            <p>
              Dokumentasi kegiatan dan suasana kampung.
            </p>

          </div>

          <div class="gallery">

            ${galleryHTML}

          </div>

        </section>


        <!-- LINGKUNGAN -->

        <section id="lingkungan">

          <div class="section-title">

            <h2>
              Lingkungan & Kebersihan
            </h2>

            <p>
              Bersama menjaga kampung agar tetap bersih,
              aman, dan nyaman.
            </p>

          </div>

          <div class="grid">

            <div class="card">

              <h3>
                🌱 Kebersihan
              </h3>

              <p class="muted">
                Menjaga kebersihan lingkungan merupakan
                tanggung jawab bersama seluruh warga.
              </p>

            </div>

            <div class="card">

              <h3>
                🗑️ Kerja Bakti
              </h3>

              <p class="muted">
                Kegiatan kerja bakti menjadi salah satu
                cara mempererat kebersamaan warga.
              </p>

            </div>

            <div class="card">

              <h3>
                🏡 Kampung Nyaman
              </h3>

              <p class="muted">
                Menciptakan lingkungan yang aman,
                nyaman, dan asri untuk semua warga.
              </p>

            </div>

          </div>

        </section>


        <!-- KONTAK -->

        <section id="kontak">

          <div class="section-title">

            <h2>
              Kontak Kampung
            </h2>

            <p>
              Hubungi pengurus RT untuk informasi lebih lanjut.
            </p>

          </div>

          <div class="card">

            <div class="info-list">

              ${contactHTML}

            </div>

          </div>

        </section>


        <!-- CTA -->

        <section>

          <div
            class="card"
            style="
              background:var(--green);
              color:white;
              text-align:center;
              padding:40px 25px;
            "
          >

            <h2>
              BERSAMA KITA BISA
            </h2>

            <p style="margin-top:8px;opacity:.9">
              Guyub, rukun, bersih, aman dan nyaman.
            </p>

          </div>

        </section>


      </div>

    `;


    /* FOOTER */

    if(co){

      document.getElementById("footerContact").innerHTML = `

        ${
          co.leader_name
          ?
          `<p>${esc(co.leader_name)}</p>`
          :
          ""
        }

        ${
          co.whatsapp
          ?
          `<p>${esc(co.whatsapp)}</p>`
          :
          ""
        }

        ${
          co.email
          ?
          `<p>${esc(co.email)}</p>`
          :
          ""
        }

      `;

    }


  }catch(error){

    console.error(
      "Supabase error:",
      error
    );

    document.getElementById("app").innerHTML = `

      <div class="c">

        <section>

          <div class="card">

            <h2>
              Website belum dapat memuat data
            </h2>

            <p class="muted" style="margin-top:10px">
              Silakan refresh halaman beberapa saat lagi.
            </p>

            <p
              style="
                margin-top:15px;
                padding:12px;
                background:#fff3f3;
                border-radius:10px;
                font-size:13px;
                word-break:break-word;
              "
            >
              ${esc(error.message || error)}
            </p>

          </div>

        </section>

      </div>

    `;

  }

}


/* =====================================================
   JALANKAN
   ===================================================== */

loadWebsite();

</script>

</body>
</html>
